<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Re-CAP - AI Video Generator</title>
  <script defer src="app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 p-6 font-sans text-center">
  <h1 class="text-4xl font-bold text-indigo-700 mb-4">🎥 Re-CAP</h1>
  <p class="mb-6 text-gray-700">Turn prompts into AI-generated videos using Runway ML via RapidAPI</p>

  <input type="text" id="prompt" placeholder="Enter a video prompt..." class="border p-3 w-3/4 max-w-md rounded mb-4 shadow">
  <br />
  <button onclick="generateVideo()" class="bg-indigo-600 text-white px-6 py-3 rounded hover:bg-indigo-700">Generate Video</button>

  <div id="loading" class="mt-6 hidden text-gray-600">⏳ Generating video...</div>
  <div id="videoContainer" class="mt-6"></div>
</body>
</html>
